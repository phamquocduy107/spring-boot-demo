version: "3.9"
services:
  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      DISABLE_SECURITY_PLUGIN: "true"
      discovery.type: single-node
    ports:
      - "9200:9200"

  recommendation-svc:
    build: ../services/recommendation-svc
    environment:
      CATALOG_API_URL: http://host.docker.internal:8080
    ports:
      - "8091:8090"
    depends_on:
      - opensearch

  search-svc:
    build: ../services/search-svc
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      CATALOG_API_URL: http://host.docker.internal:8080
    ports:
      - "8092:8090"
    depends_on:
      - opensearch


