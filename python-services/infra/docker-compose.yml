version: "3.9"
services:
  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      DISABLE_SECURITY_PLUGIN: "true"
      discovery.type: single-node
    ports:
      - "9200:9200"

  recommendation-svc:
    build: ../services/recommendation-svc
    environment:
      CATALOG_API_URL: http://host.docker.internal:8080
      ANALYTICS_API_URL: http://host.docker.internal:8093
    ports:
      - "8091:8090"
    depends_on:
      - opensearch
      - analytics-svc

  search-svc:
    build: ../services/search-svc
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      CATALOG_API_URL: http://host.docker.internal:8080
    ports:
      - "8092:8090"
    depends_on:
      - opensearch

  analytics-svc:
    build: ../services/analytics-svc
    environment:
      CATALOG_API_URL: http://host.docker.internal:8080
      ORDERS_API_URL: http://host.docker.internal:8080
    ports:
      - "8093:8090"
    depends_on:
      - opensearch


