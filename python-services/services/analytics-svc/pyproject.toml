[tool.poetry]
name = "analytics-svc"
version = "1.0.0"
description = "Analytics service for product insights and reporting"
authors = ["Duy Dep Trai <duydeptrai@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = "^0.30"
requests = "^2.31"
