version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: springbootdemo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/springbootdemo
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 12345
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JWT_SECRET: toilamotnguoivocungdeptraitaigioiconguoiyeuvocungxinhdepnetnathuymuyhieuchuyendangyeudethuonghocgioituyetvoitoimuoonyeucoaymaimaivasecuoicoayvelamvocuatoi
    ports:
      - "8080:8080"


